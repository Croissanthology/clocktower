<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clocktower</title>
<style>
  body { --bg:#0e0a0b; --panel:#161011; --panel2:#1f1617; --line:#3a2427;
    --ink:#e9dcc6; --dim:#8f7f74; --pink:#e5799f; --pinkbg:#3a1a26;
    --ask:#d9b84a; --askbg:#332a12; --bad:#d0706a; --marg:#c2a8ee;
    --ember:#7a1210; --aura:.55; --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif; }
  body.day { --bg:#efece3; --panel:#faf8f1; --panel2:#f1ede1; --line:#d9d3c3;
    --ink:#28262f; --dim:#847e6e; --pink:#c2337f; --pinkbg:#fadfee;
    --ask:#8f7a10; --askbg:#f5ecc6; --bad:#b04a4a; --marg:#7a5fd0; --ember:#a0342a; --aura:.22; }
  * { box-sizing:border-box; }
  /* faustian aura: oxblood vignette breathing like firelight, plus a hairline frame */
  #aura, #aura::before, #aura::after, #frame { position:fixed; inset:0; pointer-events:none; }
  #aura { z-index:50; opacity:var(--aura); mix-blend-mode:screen;
    background:
      radial-gradient(120% 90% at 50% 115%, var(--ember) 0%, rgba(122,18,16,.35) 30%, transparent 62%),
      radial-gradient(70% 60% at 50% -20%, rgba(122,18,16,.55) 0%, transparent 60%),
      radial-gradient(60% 100% at -10% 50%, rgba(122,18,16,.4) 0%, transparent 55%),
      radial-gradient(60% 100% at 110% 50%, rgba(122,18,16,.4) 0%, transparent 55%);
    animation:breathe 7.3s ease-in-out infinite; }
  #aura::before { content:""; background:radial-gradient(90% 70% at 50% 110%, rgba(190,60,20,.35), transparent 60%);
    animation:flick 1.7s steps(1,end) infinite; }
  #aura::after { content:""; background:radial-gradient(130% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.7) 100%);
    mix-blend-mode:multiply; }
  @keyframes breathe { 0%,100% { opacity:var(--aura); transform:scale(1); }
    38% { opacity:calc(var(--aura) * .82); transform:scale(1.012); }
    64% { opacity:calc(var(--aura) * 1.08); transform:scale(.996); } }
  @keyframes flick { 0% { opacity:.55 } 9% { opacity:.35 } 17% { opacity:.6 } 26% { opacity:.42 } 33% { opacity:.5 }
    41% { opacity:.3 } 52% { opacity:.58 } 60% { opacity:.45 } 71% { opacity:.62 } 79% { opacity:.38 } 90% { opacity:.52 } 100% { opacity:.55 } }
  #frame { z-index:51; margin:7px; border:1px solid rgba(233,220,198,.16); }
  #frame::before, #frame::after { content:""; position:absolute; width:20px; height:20px; border:1px solid rgba(233,220,198,.7); }
  #frame::before { left:-1px; top:-1px; border-right:none; border-bottom:none; }
  #frame::after { right:-1px; bottom:-1px; border-left:none; border-top:none; }
  #frame i, #frame b { position:absolute; width:20px; height:20px; border:1px solid rgba(233,220,198,.7); }
  #frame i { right:-1px; top:-1px; border-left:none; border-bottom:none; }
  #frame b { left:-1px; bottom:-1px; border-right:none; border-top:none; }
  body.day #frame, body.day #frame::before, body.day #frame::after, body.day #frame i, body.day #frame b { border-color:rgba(40,38,47,.3); }
  @media (prefers-reduced-motion:reduce) { #aura, #aura::before { animation:none; } }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.45 -apple-system, system-ui, sans-serif; height:100vh; overflow:hidden;
         transition:background .4s, color .4s; }
  button { font:inherit; background:var(--panel2); color:var(--ink); border:1px solid var(--line);
           border-radius:7px; padding:5px 12px; cursor:pointer; }
  button:hover { border-color:var(--dim); }
  button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  button.ghost { background:none; border:none; color:var(--dim); }
  button.back { background:none; border:none; color:var(--ink); font-size:34px; line-height:1;
                padding:2px 22px 8px 8px; }
  button.back:hover { color:var(--dim); }
  button.moon { background:none; border:none; padding:4px 8px; display:flex; align-items:center; }
  button.pause.paused { background:var(--ember); color:var(--ink); border-color:#a8362c; font-weight:600; letter-spacing:.03em; }
  button.pause.deny { animation:shake .5s; }
  @keyframes shake { 20%,60% { transform:translateX(-4px); } 40%,80% { transform:translateX(4px); } }
  .micw { display:flex; align-items:flex-end; gap:2px; height:20px; padding:4px 10px; cursor:pointer;
          border:1px solid var(--line); border-radius:7px; background:var(--panel2); }
  .micw .bar { width:4px; background:var(--good); border-radius:1px; min-height:2px; transition:height .3s; }
  .micw.off .bar { background:var(--bad); height:2px !important; }
  .mic-row { display:flex; align-items:center; gap:12px; padding:9px 12px; border-bottom:1px solid var(--line); }
  .mic-row .mdot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  .mic-row .who { width:180px; }
  .mic-row .track { flex:1; height:10px; background:var(--panel2); border-radius:5px; overflow:hidden; }
  .mic-row .fill { height:100%; background:var(--good); border-radius:5px; transition:width .3s; }
  /* transcript feed */
  .feed { flex:1; overflow-y:auto; border:1px solid var(--line); border-radius:12px; background:var(--panel);
          padding:16px 20px; font-size:14px; line-height:1.55; }
  .feed pre { white-space:pre-wrap; font:12px/1.5 ui-monospace, Menlo, monospace; background:var(--panel2);
              border-radius:8px; padding:10px; overflow-x:auto; margin:6px 0; }
  .f-tick { margin:18px 0 6px; color:var(--dim); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
            border-bottom:1px solid var(--line); padding-bottom:3px; }
  .f-line { white-space:pre-wrap; }
  .f-margot { color:var(--marg); }
  .f-game { color:var(--dim); font-style:italic; }
  .f-head { color:var(--dim); font-size:12px; letter-spacing:.04em; margin-top:8px; }
  .f-out { border-left:2px solid var(--c, var(--line)); padding-left:12px; margin:8px 0 4px; }
  .f-pending { opacity:.38; }
  .f-cot { font-size:11px; padding:0 6px; }
  /* seating */
  .chip-p { border:1.5px solid var(--c, var(--ink)); color:var(--c, var(--ink)); border-radius:999px;
            padding:4px 11px; font-size:12px; cursor:pointer; background:var(--panel2); }
  .chip-p:hover { background:var(--panel); }
  .setup .row { position:relative; }
  .setup .row.off { opacity:.38; filter:grayscale(.7); cursor:pointer; }
  .setup .row.off * { pointer-events:none; }
  .rowx { position:absolute; right:-26px; top:4px; color:var(--dim); background:none; border:none;
          cursor:pointer; font-size:15px; padding:2px 6px; }
  .rowx:hover { color:var(--bad); }
  .seat-menu { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
               display:flex; flex-direction:column; gap:5px; background:var(--panel);
               border:1px solid var(--line); border-radius:12px; padding:9px; z-index:5;
               max-height:290px; overflow-y:auto; min-width:150px; box-shadow:0 6px 30px rgba(0,0,0,.35); }
  .seat-menu .chip-p { text-align:center; }
  .seat-menu .unseat { border-color:var(--line); color:var(--dim); }
  .circle-wrap { position:relative; width:430px; height:390px; margin:4px auto; flex-shrink:0; }
  .ring { position:absolute; left:75px; top:60px; right:75px; bottom:60px;
          border:1.5px dashed var(--line); border-radius:50%; }
  .seat { position:absolute; width:76px; margin:-13px 0 0 -38px; text-align:center; cursor:pointer;
          font-size:11px; padding:4px 3px; border-radius:7px; border:1.5px dashed var(--line);
          background:var(--panel2); color:var(--dim);
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .seat.filled { border-style:solid; border-color:var(--c, var(--ink)); color:var(--c, var(--ink)); }
  .seat.sel { outline:2px solid var(--ink); }
  textarea, input, select { font:inherit; background:var(--panel); color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:9px 11px; width:100%; }
  textarea:focus, input:focus, select:focus { outline:none; border-color:var(--dim); }
  textarea { resize:none; }
  .top { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); height:52px; }
  .top .t { color:var(--dim); font-variant-numeric:tabular-nums; font-family:var(--serif); font-size:16px; letter-spacing:.06em; }
  .top { background:linear-gradient(to bottom, rgba(122,18,16,.16), transparent); border-bottom-color:rgba(201,151,63,.25); }
  .flash .who, .flash .what, .full .hd .role { font-family:var(--serif); }
  .flash .what { font-style:italic; font-weight:600; }
  #view { height:calc(100vh - 52px); overflow:hidden; }

  /* home */
  .home { display:flex; flex-direction:column; height:100%; padding:14px; gap:14px; }
  .boxes { flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:14px; min-height:0; }
  .box { border:1px solid color-mix(in srgb, var(--c) 88%, var(--line)); border-radius:14px; background:var(--panel); padding:14px 16px;
         cursor:pointer; display:flex; flex-direction:column; gap:8px; min-height:0; overflow:hidden;
         transition:box-shadow .25s; }
  .box:hover { background:var(--panel2); }
  .box.glow { box-shadow:0 0 30px 2px var(--c); }
  .box .hd { display:flex; align-items:baseline; gap:10px; }
  .box .nm { font:italic 600 28px/1 var(--serif); color:var(--c); letter-spacing:.01em; }
  .box { box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), inset 0 -60px 80px -60px rgba(122,18,16,.35); }
  .box::after { content:""; position:absolute; inset:5px; border:1px solid var(--c); opacity:.28; border-radius:10px; pointer-events:none; }
  .box { position:relative; }
  .box .rl { color:var(--ink); font-size:14px; }
  .box .mdl { color:var(--dim); font-size:12px; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--dim); margin-left:auto; flex-shrink:0; align-self:center; }
  .dot.thinking { background:var(--c,var(--ink)); animation:pulse 1s infinite; }
  .dot.error { background:var(--bad); }
  @keyframes pulse { 50% { opacity:.25; } }
  .st { color:var(--dim); font-size:13px; min-height:18px; }
  .action { background:var(--pinkbg); border:1px solid var(--pink); color:var(--pink);
            border-radius:8px; padding:7px 10px; display:flex; gap:10px; align-items:flex-start; font-size:14px; cursor:pointer; }
  .action.seen { opacity:.45; border-style:dashed; }
  .action b { text-transform:uppercase; font-size:12px; letter-spacing:.04em; }
  .askline { border:1px solid var(--ask); background:var(--askbg); color:var(--ask); border-radius:8px; padding:7px 10px;
             display:flex; gap:10px; align-items:flex-start; font-size:14px; cursor:pointer; }
  .sayline { display:flex; gap:8px; align-items:flex-start; background:var(--panel2);
             border-radius:8px; padding:6px 9px; font-size:14px; }
  .sayline .txt { flex:1; }
  .err { color:var(--bad); font-size:13px; }
  .pingbar { display:flex; align-items:flex-end; gap:12px; flex-shrink:0; }
  .pingbar .lbl { font:600 15px var(--serif); letter-spacing:.14em; color:var(--dim); text-transform:uppercase;
                  cursor:pointer; padding:12px 4px; }
  .pingbar .lbl:hover { color:var(--ink); }
  #ping { height:46px; font-size:15px; }

  /* fullscreen views */
  .full { height:100%; display:flex; flex-direction:column; padding:14px; gap:12px; }
  .full .hd { display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .full .hd .role { font-size:22px; font-weight:650; }
  .cols { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:14px; min-height:0; }
  .col { display:flex; flex-direction:column; gap:10px; min-height:0; }
  .col h4 { margin:0; font-size:12px; font-weight:600; letter-spacing:.06em; color:var(--dim); text-transform:uppercase; }
  #ai-priv { height:110px; flex-shrink:0; }
  #ai-sheet { flex:1; font-size:14px; line-height:1.5; }
  .hist { flex:1; overflow-y:auto; border:1px solid var(--line); border-radius:10px; background:var(--panel); padding:10px; }
  .hist .h-turn { padding:8px 4px; border-bottom:1px solid var(--line); font-size:14px; }
  .hist .h-meta { color:var(--dim); font-size:12px; }

  /* action flash (spin the laptop to the storyteller) */
  .flash { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
           gap:26px; cursor:pointer; padding:40px; text-align:center; }
  .flash .who { font-size:42px; font-weight:700; color:var(--c); }
  .flash .what { font-size:64px; font-weight:750; line-height:1.15; }
  .flash .why { font-size:22px; color:var(--dim); max-width:900px; }

  /* context stream */
  .stream { flex:1; overflow-y:auto; border:1px solid var(--line); border-radius:12px;
            background:var(--panel); padding:14px 18px; font-size:15px; }
  .s-phase { margin:16px 0 8px; color:var(--dim); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
             border-bottom:1px solid var(--line); padding-bottom:4px; }
  .s-town { white-space:pre-wrap; margin:2px 0; }
  .s-note { color:var(--dim); font-style:italic; white-space:pre-wrap; margin:2px 0; }
  .s-say { white-space:pre-wrap; margin:2px 0; }
  .s-say b { color:var(--c); }
  .ctx-in { display:flex; gap:10px; flex-shrink:0; align-items:flex-end; }
  #ctx-input { height:82px; font-size:15px; }
  .hint { color:var(--dim); font-size:12px; flex-shrink:0; }

  /* setup */
  .setup { max-width:680px; margin:24px auto; display:flex; flex-direction:column; gap:10px;
           height:calc(100% - 48px); overflow-y:auto; padding:0 10px; }
  .setup h4 { margin:8px 0 0; font-size:12px; font-weight:600; letter-spacing:.06em; color:var(--dim); text-transform:uppercase; }
  .setup .row { display:grid; grid-template-columns:1fr 110px 1fr; gap:8px; }
  .setup .row input.persona { grid-column:1/4; }
  .setup .hrow { display:flex; gap:8px; align-items:center; }
  .setup .hrow .mic { color:var(--dim); font-size:13px; width:52px; flex-shrink:0; }
</style>
</head>
<body>
<div id="aura"></div><div id="frame"><i></i><b></b></div>
<div class="top" id="top"></div>
<div id="view"></div>

<script>
const ROLES = {
  townsfolk:["washerwoman","librarian","investigator","chef","empath","fortune teller","undertaker","monk","ravenkeeper","virgin","slayer","soldier","mayor"],
  outsider:["butler","drunk","recluse","saint"],
  minion:["poisoner","spy","scarlet woman","baron"],
  demon:["imp"],
};
const COLORS = ["#8aa46a","#c9973f","#c8656e","#7d8fb3"];
const ALLIGATOR_PERSONA = "You are Alligator, a stately plushie alligator with a grand ceremonial manner. Open every spoken utterance with 'I will speak the following words:' and close it with 'I have spoken.' The words in between stay brutally short.";
function alignmentOf(r){ return (ROLES.minion.includes(r)||ROLES.demon.includes(r))?"evil":"good"; }
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function colorOf(name){ const i=S.players.findIndex(p=>p.name===name); return COLORS[i>=0?i%4:0]; }

let S = { players:[], queue:[], ctx:[], humans:[], phase:{time:"night",day:1}, phaseLabel:"night 1", turnN:0, model:"sonnet", speaking:null };
let view = { name:"home", ai:null };
let ui = { priv:{}, buffer:"", auto:false, secs:45, speakingId:null, speakingPlayer:null, sheetDirty:{},
  cotOpen:{}, seatAssign:null, seatSel:null,
  humanCount: 8,
  humanNames: ["","","","","","","",""],
  setupRows:[
    {on:false, name:"Alligator", model:"fable", role:"empath", persona:ALLIGATOR_PERSONA},
    {on:false, name:"", model:"google/gemini-3.1-pro-preview", role:"fortune teller", persona:""},
    {on:false, name:"", model:"openai/gpt-5.6-sol", role:"imp", persona:""},
    {on:false, name:"", model:"moonshotai/kimi-k3", role:"soldier", persona:""},
  ]};

async function api(p,d){ const r=await fetch(p,{method:d?"POST":"GET",headers:{"Content-Type":"application/json"},body:d?JSON.stringify(d):undefined}); return r.json(); }

async function poll(){
  try {
    S = await api("/api/state");
    if (S.speaking){ ui.speakingId=S.speaking.id; ui.speakingPlayer=S.speaking.player; }
    else if (ui.speakingId!=null && !speechSynthesis.speaking){ ui.speakingId=null; ui.speakingPlayer=null; }
    document.body.classList.toggle("day", S.phase.time==="day");
    if (!S.players.length && view.name!=="setup") nav("setup");
    update();
  } catch(e){}
  setTimeout(poll, 1200);
}

// ---------- navigation ----------
function nav(name, ai){
  view = { name, ai: ai ?? view.ai };
  const v = document.getElementById("view");
  if (name==="home") {
    v.innerHTML = `<div class="home"><div class="boxes" id="boxes"></div>
      <div class="pingbar"><span class="lbl" onclick="nav('ctx')">CONTEXT</span>
        <textarea id="ping" oninput="ui.buffer=this.value"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();doPush()}"></textarea></div></div>`;
    const p=document.getElementById("ping"); p.value=ui.buffer; p.focus();
  }
  if (name==="ai") {
    const p = S.players.find(x=>x.name===view.ai); if(!p) return nav("home");
    const c = colorOf(p.name);
    v.innerHTML = `<div class="full" style="--c:${c}">
      <div class="hd"><button class="back" onclick="nav('home')">&larr;</button>
        <span class="role" style="color:${c}">${esc(p.name)}</span>
        <span style="color:var(--ink)">${esc(p.role)}</span>
        <span style="color:var(--dim)">${esc(p.model||S.model)}</span>
        <button class="ghost" onclick="nav('feed','${esc(p.name)}')">expand</button>
        <span class="dot" id="ai-dot"></span></div>
      <div class="st" id="ai-status"></div><div id="ai-extra"></div>
      <div class="cols">
        <div class="col">
          <textarea id="ai-priv" oninput="ui.priv['${esc(p.name)}']=this.value"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendPriv('${esc(p.name)}')}"></textarea>
          <h4 style="display:flex;gap:8px;align-items:center">sheet
            <button class="ghost" id="ai-sheet-save" style="display:none" onclick="saveSheet('${esc(p.name)}')">save</button></h4>
          <textarea id="ai-sheet" oninput="ui.sheetDirty['${esc(p.name)}']=this.value; document.getElementById('ai-sheet-save').style.display='inline'"></textarea>
        </div>
        <div class="col"><h4>context window</h4><div class="feed" id="feed-body"></div></div>
      </div></div>`;
    ui.feedSig = "";
    if (!ui.sysCache) ui.sysCache = {};
    api("/api/sys/"+encodeURIComponent(p.name)).then(r=>{ ui.sysCache[p.name]=r.sys||""; ui.feedSig=""; renderFeed(); });
    const priv=document.getElementById("ai-priv");
    priv.value = ui.priv[p.name]||"";
    document.getElementById("ai-sheet").value = ui.sheetDirty[p.name] ?? p.sheet;
    if (ui.sheetDirty[p.name]!=null) document.getElementById("ai-sheet-save").style.display="inline";
    priv.focus();
  }
  if (name==="flash") {
    const p = S.players.find(x=>x.name===view.ai); if(!p||!p.action) return nav("home");
    const a = p.action;
    v.innerHTML = `<div class="flash" style="--c:${colorOf(p.name)}" onclick="ackFlash('${esc(p.name)}')">
      <div class="who">${esc(p.name)} · ${esc(p.role)}</div>
      <div class="what">${esc(a.type)} &rarr; ${esc(a.target||"—")}</div></div>`;
  }
  if (name==="whispers") {
    v.innerHTML = `<div class="full">
      <div class="hd"><button class="back" onclick="nav('home')">&larr;</button>
        <span class="role">WHISPERS</span>
        <span style="color:var(--dim);font-size:13px;margin-left:auto">side laptops open <b style="color:var(--ink);font-weight:500;user-select:all">${esc(S.lanUrl||"")}</b></span></div>
      <div class="stream" id="whispers-body"></div>
      <div class="hint">private threads between humans at the side laptops and the AIs. text only, never spoken. the storyteller may read; the table may not.</div>
    </div>`;
    ui.whSig = "";
  }
  if (name==="ctx") {
    v.innerHTML = `<div class="full">
      <div class="hd"><button class="back" onclick="nav('home')">&larr;</button>
        <span class="role">CONTEXT</span></div>
      <div class="stream" id="stream"></div>
      <div class="ctx-in">
        <textarea id="ctx-input" oninput="ui.buffer=this.value"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();doPush()}"></textarea>
        <button class="on" style="height:44px" onclick="doPush()">push</button></div>
      <div class="hint">! prefix = wrangler note</div>
    </div>`;
    const inp=document.getElementById("ctx-input");
    inp.value = ui.buffer; inp.focus();
    ui.streamLen = -1;
  }
  if (name==="feed") {
    const p = S.players.find(x=>x.name===view.ai); if(!p) return nav("home");
    v.innerHTML = `<div class="full" style="--c:${colorOf(p.name)}">
      <div class="hd"><button class="back" onclick="nav('ai','${esc(p.name)}')">&larr;</button>
        <span class="role" style="color:${colorOf(p.name)}">${esc(p.name)}</span>
        <span style="color:var(--dim)">every token, in order · gray = not read yet</span></div>
      <div class="feed" id="feed-body"></div></div>`;
    ui.feedSig = "";
    if (!ui.sysCache) ui.sysCache = {};
    api("/api/sys/"+encodeURIComponent(p.name)).then(r=>{ ui.sysCache[p.name]=r.sys||""; ui.feedSig=""; renderFeed(); });
    renderFeed();
  }
  if (name==="mics") {
    v.innerHTML = `<div class="full">
      <div class="hd"><button class="back" onclick="nav('home')">&larr;</button>

async function saveMics(){
  const humans = ui.humanNames.slice(0,ui.humanCount).map((n,i)=>({name:n, mic:i+1}));
  await api("/api/humans",{humans}); nav("home");
}
// mirror the server's player-naming so the circle shows names as they will be dealt
function setupNames(){
  const used={};
  const ais = ui.setupRows.filter(r=>r.on && r.role).map(r=>{
    const base=(r.model||"sonnet").split("/").pop();
    used[base]=(used[base]||0)+1;
    const auto = used[base]>1?`${base}-${used[base]}`:base;
    return { name:(r.name||"").trim()||auto, ai:true };
  });
  const humans = ui.humanNames.slice(0,ui.humanCount).map(n=>({name:n.trim(),ai:false})).filter(x=>x.name);
  return ais.concat(humans);
}
// seats are positions (as many as there are enabled players); each holds a name or null.
// reconcile keeps assignments for names that still exist and resizes to the player count.
function reconcileSeats(){
  const people = setupNames();
  const names = people.map(x=>x.name);
  const old = ui.seatAssign || (S.seats||[]).slice();
  const kept = old.map(n => (n && names.includes(n)) ? n : null);
  const assign = Array.from({length:names.length}, (_,i)=> i<kept.length ? kept[i] : null);
  // a kept name beyond the new length gets the first free slot
  for (const n of kept.slice(names.length).filter(Boolean)) {
    const free = assign.indexOf(null); if (free>=0) assign[free]=n;
  }
  ui.seatAssign = assign;
  return people;
}
function colorOfSetup(name, people){
  const p = people.find(x=>x.name===name);
  if (!p) return null;
  return p.ai ? COLORS[people.filter(x=>x.ai).findIndex(x=>x.name===name)%4] : "var(--ink)";
}
function renderSeating(){
  const circle = document.getElementById("circle");
  if (!circle) return;
  const people = reconcileSeats();
  const n = Math.max(1, ui.seatAssign.length);   // zero players: one lone empty seat
  if (ui.seatMenu!=null && ui.seatMenu >= ui.seatAssign.length) ui.seatMenu = null;
  const seats = (ui.seatAssign.length ? ui.seatAssign : [null]).map((name,i)=>{
    const a = -Math.PI/2 + (2*Math.PI*i)/n;
    const x = 215 + 150*Math.cos(a), y = 190 + 145*Math.sin(a);
    const c = name ? colorOfSetup(name, people) : null;
    return `<div class="seat ${name?"filled":""} ${ui.seatMenu===i?"sel":""}"
      style="left:${x}px;top:${y}px;${c?`--c:${c}`:""}"
      onclick="event.stopPropagation();seatClick(${i})">${name?esc(name):"&nbsp;"}</div>`;
  }).join("");
  let menu = "";
  if (ui.seatMenu!=null){
    const i = ui.seatMenu;
    const unplaced = people.filter(p=>!ui.seatAssign.includes(p.name));
    const items =
      (ui.seatAssign[i]?`<span class="chip-p unseat" onclick="event.stopPropagation();ui.seatAssign[${i}]=null;ui.seatMenu=null;renderSeating()">unseat ${esc(ui.seatAssign[i])}</span>`:"") +
      unplaced.map(p=>`<span class="chip-p" style="--c:${colorOfSetup(p.name,people)}"
        onclick="event.stopPropagation();placeAt(${i},'${esc(p.name)}')">${esc(p.name)}</span>`).join("");
    menu = `<div class="seat-menu">${items || `<span style="color:var(--dim);font-size:12px">no one left to seat</span>`}</div>`;
  }
  circle.innerHTML = `<div class="ring"></div>` + seats + menu;
}
function seatClick(i){
  if (!ui.seatAssign.length) return;             // the lone placeholder seat isn't assignable yet
  ui.seatMenu = (ui.seatMenu===i ? null : i);
  renderSeating();
}
function placeAt(i, name){
  ui.seatAssign[i] = name;
  const next = ui.seatAssign.indexOf(null);      // flow to the next empty seat's menu
  ui.seatMenu = next>=0 ? next : null;
  renderSeating();
}
function finalSeats(){
  reconcileSeats();
  const people = setupNames();
  const seated = ui.seatAssign.filter(Boolean);
  return seated.concat(people.map(p=>p.name).filter(n=>!seated.includes(n)));
}
async function saveSeats(){
  await api("/api/seats",{seats:finalSeats()}); nav("home");
}
function setHumanCount(n){ ui.humanCount=n; while(ui.humanNames.length<n) ui.humanNames.push(""); nav("setup"); }

// ---------- transcript feed ----------
function feedLines(text, extraCls){
  return text.split("\n").map(l=>{
    let cls = "f-line "+(extraCls||"");
    if (/^MARGOT[,:]/.test(l) || /^=== MARGOT, PRIVATELY/.test(l)) cls += " f-margot";
    else if (/^GAME:/.test(l)) cls += " f-game";
    else if (/^===|^--NIGHT--|^--DAY--/.test(l)) cls += " f-head";
    return `<div class="${cls}">${esc(l)||"&nbsp;"}</div>`;
  }).join("");
}
// the sheet rides along inside every tick's input; the context window shows it elided
// (it lives in its own box) but expandable, so "every token" stays literally true.
function elideSheet(input){
  const m = input.indexOf("=== your sheet");
  if (m < 0) return { pre: input, sheet: null, post: "" };
  const start = input.indexOf("\n", m);
  const nextHdr = input.indexOf("\n=== ", start);
  return { pre: input.slice(0, m),
           sheet: input.slice(start + 1, nextHdr < 0 ? input.length : nextHdr),
           post: nextHdr < 0 ? "" : input.slice(nextHdr + 1) };
}
function renderFeed(){
  const el = document.getElementById("feed-body"); if(!el) return;
  const p = S.players.find(x=>x.name===view.ai); if(!p) return;
  const pending = S.ctx.slice(p.ctxCursor||0);
  const sig = `${p.history.length}:${S.ctx.length}:${p.status}`;
  if (sig === ui.feedSig) return;
  ui.feedSig = sig;
  const pinned = el.scrollHeight - el.scrollTop - el.clientHeight < 80 || el.scrollTop===0;
  let html = `<details><summary style="color:var(--dim);cursor:pointer">system prompt — briefing + full rules + secret card + seat (every tick's context starts with this)</summary>
    <pre>${esc(ui.sysCache?.[p.name]||"loading...")}</pre></details>`;
  for (const h of p.history){
    const key = p.name+":"+h.turn+":"+h.ts;
    html += `<div class="f-tick">tick ${h.turn} · ${esc(h.phase)}</div>`;
    if (h.input) {
      const {pre, sheet, post} = elideSheet(h.input);
      html += feedLines(pre);
      if (sheet!=null) html += `<details><summary style="color:var(--dim);font-size:12px;cursor:pointer">sheet as it was this tick (elided — see sheet box)</summary><pre>${esc(sheet)}</pre></details>`;
      html += feedLines(post);
    }
    html += `<div class="f-out">
      <div style="color:var(--dim);font-size:12px">${esc(p.name)} responds
        ${h.thinking?`<button class="ghost f-cot" onclick="ui.cotOpen['${key}']=!ui.cotOpen['${key}'];ui.feedSig='';renderFeed()">${ui.cotOpen[key]?"hide thought":"…"}</button>`:""}</div>
      ${ui.cotOpen[key]&&h.thinking?`<pre>${esc(h.thinking)}</pre>`:""}
      ${h.status?`<div style="color:var(--dim)">${esc(h.status)}</div>`:""}
      ${h.say.map(s=>`<div>&ldquo;${esc(s.text)}&rdquo;${h.sayHeld?' <span style="color:var(--ask);font-size:12px">(held — night)</span>':""}</div>`).join("")}
      ${h.action?`<div style="color:var(--pink)">${esc(h.action.type)} &rarr; ${esc(h.action.target||"")}</div>`:""}
      ${h.ask?`<div style="color:var(--ask)">? ${esc(h.ask)}</div>`:""}
      ${h.edits?`<div style="color:var(--dim);font-size:12px">${h.edits} sheet edit${h.edits>1?"s":""}${h.editsFailed?` · <span style="color:var(--bad)">${h.editsFailed} failed</span>`:""}</div>`:""}
    </div>`;
  }
  if (pending.length){
    html += `<div class="f-tick f-pending">not yet read — lands next tick</div>`;
    html += pending.map(e=>{
      let t = e.kind==="say" ? `${e.player} (AI, aloud)${e.to&&e.to!=="town"?" to "+e.to:""}: ${e.text}`
            : e.kind==="note" ? `MARGOT: ${e.text}`
            : e.kind==="phase" ? `GAME: ${e.text}` : e.text;
      return feedLines(t, "f-pending");
    }).join("");
  }
  el.innerHTML = html;
  if (pinned) el.scrollTop = el.scrollHeight;
}

        return `<div class="s-phase" style="display:flex;gap:10px;align-items:baseline"><span>${esc(h)} &harr; <span style="color:${c}">${esc(a)}</span></span>${waiting?`<span style="color:${c};text-transform:none;letter-spacing:0">answering…</span>`:""}</div>`+
          t.map(w=>`<div class="s-say">${w.from==="ai"?`<b style="color:${c}">${esc(a)}</b>`:`<b style="color:var(--ink)">${esc(h)}</b>`}: ${esc(w.text)}</div>`).join("");
      }).join("") : `<div class="s-note">no whispers yet</div>`;
    }
  }

  if (view.name==="ctx") {
    if (ui.streamLen !== S.ctx.length) {
      ui.streamLen = S.ctx.length;
      const el = document.getElementById("stream");
      const pinned = el.scrollHeight - el.scrollTop - el.clientHeight < 60 || el.scrollTop===0;
      el.innerHTML = S.ctx.map(e=>{
        if (e.kind==="phase") return `<div class="s-phase">${esc(e.text)}</div>`;
        if (e.kind==="say") return `<div class="s-say" style="--c:${colorOf(e.player)}"><b>${esc(e.player)}${e.to&&e.to!=="town"?" &rsaquo; "+esc(e.to):""}</b> ${esc(e.text)}</div>`;
        if (e.kind==="note") return `<div class="s-note">! ${esc(e.text)}</div>`;
        return `<div class="s-town">${esc(e.text)}</div>`;
      }).join("");
      if (pinned) el.scrollTop = el.scrollHeight;
    }
  }
}

// ---------- actions ----------
async function doSetup(){
  const players = ui.setupRows.filter(r=>r.on && r.role).map(r=>({name:r.name, model:r.model, role:r.role, alignment:alignmentOf(r.role), persona:r.persona}));
  if (!players.length && !ui.humanNames.slice(0,ui.humanCount).some(n=>n.trim())) return;
  const humans = ui.humanNames.slice(0,ui.humanCount).map((n,i)=>({name:n, mic:i+1}));
  await api("/api/setup",{players, humans, seats:finalSeats()});
  ui.priv={}; ui.sheetDirty={}; ui.buffer=""; ui.cotOpen={};
  S = await api("/api/state"); nav("home");
}
function splitBuffer(){
  const lines = ui.buffer.split("\n");
  return { town: lines.filter(l=>!l.startsWith("!")).join("\n").trim(),
           note: lines.filter(l=>l.startsWith("!")).map(l=>l.slice(1).trim()).join("\n") };
}
async function doPush(){
  if (S.paused) { shakePause(); return; }
  const {town,note} = splitBuffer();
  await api("/api/push",{targets:S.players.map(p=>p.name), town, note, private:ui.priv});
  ui.buffer=""; ui.priv={};
  for (const id of ["ctx-input","ping","ai-priv"]) { const el=document.getElementById(id); if(el) el.value=""; }
  S = await api("/api/state"); update();
}
// enter in a player's private box: inject to that AI immediately, even while paused
async function sendPriv(name){
  const text = ui.priv[name]||"";
  if (!text.trim()) return;
  await api("/api/push",{targets:[name], town:"", note:"", private:{[name]:text}, force:true});
  delete ui.priv[name];
  const pv=document.getElementById("ai-priv"); if(pv && view.ai===name) pv.value="";
  S = await api("/api/state"); update();
}
function shakePause(){
  const b=document.querySelector("button.pause"); if(!b) return;
  b.classList.add("deny"); setTimeout(()=>b.classList.remove("deny"), 600);
}
async function saveSheet(name){
  await api("/api/edit",{player:name, field:"sheet", value:ui.sheetDirty[name]??""});
  delete ui.sheetDirty[name];
  const b=document.getElementById("ai-sheet-save"); if(b) b.style.display="none";
}
async function ack(name){ await api("/api/edit",{player:name, field:"actionSeen"}); S=await api("/api/state"); update(); }
async function ackFlash(name){ await api("/api/edit",{player:name, field:"actionSeen"}); S=await api("/api/state"); nav("home"); }
async function askSeen(name){ await api("/api/edit",{player:name, field:"askSeen"}); S=await api("/api/state"); update(); }
async function togglePhase(){ const r=await api("/api/phase",{toggle:true}); S.phase=r.phase; S=await api("/api/state");
  document.body.classList.toggle("day", S.phase.time==="day"); update(); }
async function dequeue(id,remove){
  if(ui.speakingId===id){ await api("/api/speak",{stop:true}); speechSynthesis.cancel(); ui.speakingId=null; ui.speakingPlayer=null; }
  await api("/api/queue",{id,remove}); S=await api("/api/state"); update();
}
async function togglePause(){ const r=await api("/api/pause",{}); S.paused=r.paused; update(); }
let autoTimer=null;
function toggleAuto(){
  ui.auto=!ui.auto; clearInterval(autoTimer);
  if(ui.auto) autoTimer=setInterval(doPush, ui.secs*1000);
  update();
}

// speech plays on the server (the machine the real speakers hang off); browser TTS fallback
async function speak(id){
  const q=S.queue.find(x=>x.id===id); if(!q) return;
  if(ui.speakingId===id){ await api("/api/speak",{stop:true}); speechSynthesis.cancel(); ui.speakingId=null; ui.speakingPlayer=null; update(); return; }
  try {
    const r = await api("/api/speak",{id});
    if(!r.err){ ui.speakingId=id; ui.speakingPlayer=q.player; update(); return; }
    if(r.err==="already speaking") return;
  } catch(e){}
  speakBrowser(q);
}
function speakBrowser(q){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(q.text);
  const voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith("en"));
  const idx=S.players.findIndex(p=>p.name===q.player);
  if(voices.length) u.voice=voices[(idx*3+1)%voices.length];
  u.pitch=[1,0.8,1.2,0.9][idx%4]; u.rate=1.1;
  u.onend=()=>{ ui.speakingId=null; ui.speakingPlayer=null; dequeue(q.id,false); };
  ui.speakingId=q.id; ui.speakingPlayer=q.player;
  speechSynthesis.speak(u); update();
}

// arrows navigate from anywhere: down = context, up = home.
// exceptions: the sheet editor and setup view keep normal arrows; selects always do.
document.addEventListener("keydown", e=>{
  const a = document.activeElement;
  const inExempt = view.name==="setup" || (a && (a.tagName==="SELECT" || a.id==="ai-sheet"));
  if (view.name==="flash" && (e.key==="Escape"||e.key==="ArrowUp"||e.key==="Enter")) { nav("home"); return; }
  if (!inExempt && e.key==="ArrowDown" && view.name!=="ctx") { e.preventDefault(); nav("ctx"); return; }
  if (!inExempt && e.key==="ArrowUp" && view.name!=="home") { e.preventDefault(); nav("home"); return; }
  if (e.key==="Escape") { nav("home"); return; }
  if (a && (a.tagName==="TEXTAREA"||a.tagName==="INPUT"||a.tagName==="SELECT")) return;
  if (e.key==="m") { nav("mics"); return; }
  if ("1234".includes(e.key)) { const p=S.players[+e.key-1]; if(p) nav("ai",p.name); }
});

speechSynthesis.getVoices();
(async()=>{ try{ S=await api("/api/state"); }catch(e){} nav(S.players.length?"home":"setup"); poll(); })();
</script>
