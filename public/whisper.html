<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whisper</title>
<style>
  :root { --bg:#0e0a0b; --panel:#161011; --panel2:#1f1617; --line:#3a2427; --ink:#e9dcc6; --dim:#8f7f74;
    --ember:#7a1210; --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, system-ui, sans-serif; overflow:hidden; }
  #aura { position:fixed; inset:0; pointer-events:none; z-index:50; mix-blend-mode:screen; opacity:.5;
    background:
      radial-gradient(120% 90% at 50% 115%, var(--ember) 0%, rgba(122,18,16,.35) 30%, transparent 62%),
      radial-gradient(70% 60% at 50% -20%, rgba(122,18,16,.5) 0%, transparent 60%);
    animation:breathe 7.3s ease-in-out infinite; }
  #aura::before { content:""; position:absolute; inset:0; background:radial-gradient(90% 70% at 50% 110%, rgba(190,60,20,.35), transparent 60%);
    animation:flick 1.7s steps(1,end) infinite; }
  @keyframes breathe { 0%,100% { opacity:.5 } 38% { opacity:.41 } 64% { opacity:.55 } }
  @keyframes flick { 0% { opacity:.55 } 9% { opacity:.35 } 17% { opacity:.6 } 26% { opacity:.42 } 41% { opacity:.3 } 52% { opacity:.58 } 71% { opacity:.62 } 79% { opacity:.38 } 100% { opacity:.55 } }
  #frame { position:fixed; inset:7px; pointer-events:none; z-index:51; border:1px solid rgba(233,220,198,.16); }
  #frame i, #frame b, #frame::before, #frame::after { content:""; position:absolute; width:20px; height:20px; border:1px solid rgba(233,220,198,.7); }
  #frame::before { left:-1px; top:-1px; border-right:none; border-bottom:none; }
  #frame::after { right:-1px; bottom:-1px; border-left:none; border-top:none; }
  #frame i { right:-1px; top:-1px; border-left:none; border-bottom:none; }
  #frame b { left:-1px; bottom:-1px; border-right:none; border-top:none; }

  .wrap { height:100%; display:flex; flex-direction:column; max-width:820px; margin:0 auto; padding:28px 24px 20px; gap:18px; }
  .wrap.pick { justify-content:center; gap:40px; padding-bottom:12vh; }
  .wrap.pick h1 { font-size:54px; }
  h1 { margin:0; font:italic 600 34px/1.1 var(--serif); letter-spacing:.01em; }
  h1 small { display:block; font:400 13px/1.4 -apple-system, system-ui, sans-serif; color:var(--dim); letter-spacing:.12em; text-transform:uppercase; margin-top:8px; }
  .step { display:flex; flex-direction:column; gap:12px; }
  .q { color:var(--dim); font:500 13px/1 -apple-system, system-ui, sans-serif; letter-spacing:.14em; text-transform:uppercase; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; }
  .chip { border:1px solid var(--line); background:var(--panel2); color:var(--ink); border-radius:999px; padding:16px 30px;
          font:500 24px/1 var(--serif); cursor:pointer; letter-spacing:.02em; }
  .chip:hover { border-color:var(--dim); background:var(--panel); }
  .chip.ai { border-color:var(--c); color:var(--c); font-style:italic; font-size:30px; padding:18px 34px; }
  .hd { display:flex; align-items:baseline; gap:14px; border-bottom:1px solid var(--line); padding-bottom:12px; }
  .hd .you { color:var(--dim); }
  .hd .them { font:italic 600 30px/1 var(--serif); color:var(--c); }
  .hd button { margin-left:auto; background:none; border:1px solid var(--line); color:var(--dim); border-radius:7px; padding:5px 11px; font:inherit; font-size:13px; cursor:pointer; }
  .thread { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:6px 2px; }
  .msg { max-width:78%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; line-height:1.5; }
  .msg.human { align-self:flex-end; background:var(--panel2); border:1px solid var(--line); }
  .msg.ai { align-self:flex-start; background:transparent; border:1px solid var(--c); color:var(--ink); font-family:var(--serif); font-size:18px; }
  .msg.ai b { display:block; font-size:12px; font-family:-apple-system, system-ui, sans-serif; color:var(--c); letter-spacing:.1em; text-transform:uppercase; margin-bottom:5px; font-weight:600; }
  .wait { align-self:flex-start; color:var(--dim); font-style:italic; font-family:var(--serif); }
  .wait::after { content:""; display:inline-block; width:6px; height:6px; margin-left:8px; border-radius:50%; background:var(--c); vertical-align:middle; }
  .empty { color:var(--dim); font-style:italic; font-family:var(--serif); font-size:18px; margin:auto; text-align:center; max-width:460px; }
  .in { display:flex; gap:10px; align-items:flex-end; }
  textarea { flex:1; font:inherit; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px;
             padding:12px 14px; height:74px; resize:none; }
  textarea:focus { outline:none; border-color:var(--dim); }
  textarea:disabled { opacity:.5; }
  .send { background:var(--ember); color:var(--ink); border:1px solid #a8362c; border-radius:10px; padding:0 22px; height:74px; font:600 15px/1 -apple-system, system-ui, sans-serif; letter-spacing:.06em; cursor:pointer; }
  .send:disabled { opacity:.4; cursor:default; }
  .hint { color:var(--dim); font-size:12px; text-align:center; }
</style>
</head>
<body>
<div id="aura"></div><div id="frame"><i></i><b></b></div>
<div class="wrap" id="app"></div>
<script>
const COLORS = ["#8aa46a","#c9973f","#c8656e","#7d8fb3"];
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
async function api(p,d){ const r=await fetch(p,{method:d?"POST":"GET",headers:{"Content-Type":"application/json"},body:d?JSON.stringify(d):undefined}); return r.json(); }

let roster = { humans:[], ais:[] };
let me = null, ai = null, aiIdx = 0;
let thread = [], thinking = false, draft = "", sig = "";
try { me = sessionStorage.getItem("me") || null; ai = sessionStorage.getItem("ai") || null; } catch(e) {}

const app = document.getElementById("app");
function render(){
  app.className = "wrap" + (me && ai ? "" : " pick");
  if (!me) {
    app.innerHTML = `<h1>Whisper<small>a private word with one of the machines</small></h1>
      <div class="step"><div class="q">who are you</div>
      <div class="chips">${roster.humans.map(h=>`<span class="chip" onclick="pick('me','${esc(h)}')">${esc(h)}</span>`).join("")||
        `<span class="empty">no players seated yet — ask margot</span>`}</div></div>`;
    return;
  }
  if (!ai) {
    app.innerHTML = `<h1>Whisper<small>${esc(me)} — <a href="#" onclick="reset();return false" style="color:var(--dim)">not you?</a></small></h1>
      <div class="step"><div class="q">whisper to</div>
      <div class="chips">${roster.ais.map(a=>`<span class="chip ai" style="--c:${COLORS[a.idx%4]}" onclick="pick('ai','${esc(a.name)}',${a.idx})">${esc(a.name)}</span>`).join("")}</div></div>`;
    return;
  }
  const c = COLORS[aiIdx%4];
  const s = JSON.stringify([thread.map(t=>t.id), thinking]);
  if (document.getElementById("thread") && s===sig) return;
  sig = s;
  app.innerHTML = `<div class="hd" style="--c:${c}"><span class="you">${esc(me)} whispers to</span><span class="them">${esc(ai)}</span>
      <button onclick="leave()">leave</button></div>
    <div class="thread" id="thread" style="--c:${c}">
      ${thread.length?thread.map(t=>`<div class="msg ${t.from}">${t.from==="ai"?`<b>${esc(ai)}</b>`:""}${esc(t.text)}</div>`).join("")
        :`<div class="empty">Nobody else will hear this. ${esc(ai)} answers in writing, only here — and may lie, as anyone might.</div>`}
      ${thinking?`<div class="wait">${esc(ai)} is thinking</div>`:""}
    </div>
    <div class="in"><textarea id="ta" placeholder="whisper…" ${thinking?"disabled":""}
        oninput="draft=this.value" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
      <button class="send" onclick="send()" ${thinking?"disabled":""}>whisper</button></div>
    <div class="hint">enter to send · leave when you walk away so the next person starts fresh</div>`;
  const ta = document.getElementById("ta"); ta.value = draft; if (!thinking) ta.focus();
  const th = document.getElementById("thread"); th.scrollTop = th.scrollHeight;
}
function pick(k, v, idx){ if (k==="me") me=v; else { ai=v; aiIdx=idx; } try{ sessionStorage.setItem("me",me||""); sessionStorage.setItem("ai",ai||""); }catch(e){} thread=[]; sig=""; render(); poll(true); }
function reset(){ me=null; ai=null; try{ sessionStorage.clear(); }catch(e){} render(); }
function leave(){ ai=null; me=null; draft=""; try{ sessionStorage.clear(); }catch(e){} render(); }
async function send(){
  const text = draft.trim(); if (!text || thinking) return;
  draft = ""; thinking = true; sig = "";
  thread.push({ id:"tmp"+Date.now(), from:"human", text });
  render();
  await api("/api/whisper", { human: me, ai, text });
}
let pollTimer = null;
async function poll(once){
  clearTimeout(pollTimer);
  try {
    roster = await api("/api/roster");
    if (me && ai) {
      const a = roster.ais.find(x=>x.name===ai); if (a) aiIdx = a.idx;
      const r = await api(`/api/whisper?human=${encodeURIComponent(me)}&ai=${encodeURIComponent(ai)}`);
      if (r.thread) { thread = r.thread; thinking = r.thinking; }
    }
    render();
  } catch(e) {}
  if (!once) pollTimer = setTimeout(poll, 1500);
  else pollTimer = setTimeout(poll, 1500);
}
// never let the terminal blink out: hold a screen wake lock (needs one user gesture first), re-acquire whenever the tab comes back
let wake = null;
async function holdWake(){ try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", ()=>{ wake = null; }); } } catch(e) {} }
document.addEventListener("click", holdWake, { passive:true });
document.addEventListener("keydown", holdWake, { passive:true });
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState === "visible") holdWake(); });
setInterval(holdWake, 30000);
render(); poll();
</script>
</body>
</html>
