<!doctype html>
<meta charset="utf-8">
<title>mics</title>
<style>
  body { margin:0; background:#0e0a0b; color:#e9dcc6; font:16px/1.5 "Iowan Old Style", Palatino, Georgia, serif; padding:28px; }
  h1 { font-style:italic; font-weight:600; margin:0 0 4px; }
  .hint { color:#8f7f74; margin-bottom:22px; }
  .row { display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid #2b1c1e; }
  .n { width:70px; font-size:22px; font-style:italic; }
  .bar { flex:1; height:12px; background:#1f1617; border-radius:6px; overflow:hidden; }
  .fill { height:100%; background:#8aa46a; border-radius:6px; transition:width .25s; }
  .who { width:220px; }
  .who input { font:inherit; background:#161011; color:#e9dcc6; border:1px solid #3a2427; border-radius:7px; padding:5px 9px; width:170px; }
  .ok { color:#8aa46a; width:150px; font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
  .bad { color:#d0706a; }
  button { font:inherit; background:#1f1617; color:#e9dcc6; border:1px solid #3a2427; border-radius:8px; padding:7px 14px; cursor:pointer; }
  button.on { background:#e9dcc6; color:#0e0a0b; }
  .log { margin-top:22px; color:#8f7f74; font-size:14px; max-height:160px; overflow-y:auto; }
</style>
<body>
<h1>mics</h1>
<div class="hint">setup: turn on <b>check mode</b>, then say "mic one", "mic two"… into each lav — the row should light and say ok. later, players say "hi, I'm Kate on mic three" and their name attaches itself. <b>reset</b> clears names for the next group.</div>
<div style="display:flex;gap:10px;margin-bottom:14px"><button id="chk" onclick="toggle()">check mode</button><button onclick="reset()">reset names</button></div>
<div id="rows"></div>
<div class="log" id="log"></div>
<script>
let S=null;
async function api(p,d){return (await fetch(p,{method:d?'POST':'GET',headers:{'Content-Type':'application/json'},body:d?JSON.stringify(d):undefined})).json();}
async function toggle(){ await api('/api/micsetup',{on:!(S&&S.micSetup)}); }
async function reset(){ for(let i=1;i<=8;i++) await api('/api/register',{mic:i}); }
async function setName(i,v){ await api('/api/register',{mic:i,name:v}); }
async function poll(){
  try{ S=await api('/api/state');
    document.getElementById('chk').className=S.micSetup?'on':'';
    const levels=S.micLevels||[], ago=S.micSpeech||[];
    const rows=[]; for(let i=1;i<=7;i++){ const m=S.mics[i]||{}; const lv=Math.min(1,(levels[i-1]||0)*60);
      rows.push(`<div class="row"><div class="n">mic ${i}</div><div class="bar"><div class="fill" style="width:${lv*100}%"></div></div>
        <div class="who"><input value="${m.name||''}" placeholder="name" onchange="setName(${i},this.value)"></div>
        <div class="ok ${m.heardOn&&m.heardOn!==i?'bad':''}">${m.verified?(m.heardOn===i?'ok':'heard on '+m.heardOn):(ago[i-1]!=null&&ago[i-1]<3?'hearing…':'')}</div></div>`); }
    document.getElementById('rows').innerHTML=rows.join('');
    document.getElementById('log').innerHTML=S.ctx.slice(-8).filter(e=>e.kind!=='say').map(e=>`<div>${e.kind==='phase'?'★ ':''}${(e.who?e.who+': ':'')+e.text}</div>`).join('');
  }catch(e){}
  setTimeout(poll,700);
}
poll();
</script>

<script>
// keep cheap laptops awake: a screen wake lock (re-taken on any tap and every 30 s) PLUS a silently "playing"
// video fed from the static canvas — chromium treats live media playback as a reason not to sleep the display
(function(){
  let wake=null; async function hold(){ try{ if(navigator.wakeLock && !wake){ wake=await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{wake=null;}); } }catch(e){} }
  document.addEventListener('click',hold,{passive:true}); document.addEventListener('keydown',hold,{passive:true});
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') hold(); }); setInterval(hold,30000); hold();
  try{ const c=document.getElementById('noise')||document.createElement('canvas'); const v=document.createElement('video');
    v.muted=true; v.playsInline=true; v.autoplay=true; v.loop=true; v.style.cssText='position:fixed;width:2px;height:2px;opacity:.01;pointer-events:none;bottom:0;right:0';
    v.srcObject=c.captureStream(4); document.body.appendChild(v); const p=()=>v.play().catch(()=>{}); p(); document.addEventListener('click',p,{passive:true}); setInterval(p,15000); }catch(e){}
})();
</script>
</body>
