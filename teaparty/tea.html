<!doctype html>
<meta charset="utf-8">
<title>the mushroom room</title>
<style>
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; overflow:hidden; }
  body { background:#050308; color:#f3e6c3; font:16px/1.5 "Iowan Old Style", Palatino, Georgia, serif; }
  #bg { position:fixed; inset:-20%; z-index:0; filter:blur(40px) saturate(1.4) brightness(.5);
    background: radial-gradient(40% 50% at 25% 40%, hsl(190 80% 40%), transparent 70%), radial-gradient(35% 45% at 75% 60%, hsl(300 70% 40%), transparent 70%),
      radial-gradient(60% 60% at 50% 100%, hsl(10 70% 30%), transparent 70%), linear-gradient(160deg,#1a0b26,#0b1a1e 60%,#2a0e0e);
    animation:drift 40s ease-in-out infinite alternate; }
  @keyframes drift { 50% { transform:translate(-4%,3%) rotate(2deg) scale(1.08); } 100% { transform:translate(3%,-3%) rotate(-2deg) scale(1.03); } }
  #noise { position:fixed; inset:0; z-index:1; width:100%; height:100%; opacity:.08; mix-blend-mode:overlay; pointer-events:none; image-rendering:pixelated; }
  #scan { position:fixed; inset:0; z-index:2; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px); }
  #vig { position:fixed; inset:0; z-index:4; pointer-events:none; background:radial-gradient(ellipse 75% 70% at 50% 50%, transparent 45%, rgba(0,0,0,.6) 75%, rgba(0,0,0,.95) 100%); }
  #ui { position:relative; z-index:3; height:100%; display:grid; grid-template-rows:auto 1fr auto; padding:18px 24px; gap:12px; }
  .top { display:flex; align-items:center; gap:14px; }
  .top h1 { margin:0; font-style:italic; font-weight:600; font-size:26px; color:#9be3e8; text-shadow:0 0 16px rgba(120,230,240,.6); flex:1; }
  .top button, .top input { font:inherit; background:rgba(0,0,0,.35); color:#f3e6c3; border:1px solid rgba(243,230,195,.3); border-radius:8px; padding:6px 12px; cursor:pointer; }
  .top button.on { background:#f3e6c3; color:#050308; }
  .main { display:grid; grid-template-columns:1.25fr 1fr; gap:16px; min-height:0; }
  .scroll { border:1px solid rgba(232,217,176,.25); border-radius:14px; padding:20px 26px; background:rgba(20,14,8,.55); font:19px/1.7 "Courier New", Courier, monospace; color:#e8d9b0; overflow:hidden; display:flex; flex-direction:column; }
  .scroll .lbl { font:13px/1 "Iowan Old Style", Georgia, serif; letter-spacing:.2em; text-transform:uppercase; color:#b89a6a; margin-bottom:14px; }
  .scroll .base { flex:1; overflow-y:auto; white-space:pre-wrap; }
  .scroll .base .cursor { display:inline-block; width:10px; height:20px; background:#e8d9b0; vertical-align:-3px; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0 } }
  .scroll .dead { color:#7a6a4a; font-size:14px; }
  .right { display:flex; flex-direction:column; gap:12px; min-height:0; }
  .chars { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card { border:1px solid hsl(var(--h) 60% 60% / .5); border-radius:12px; padding:10px 12px; background:rgba(0,0,0,.35); }
  .card .nm { font-style:italic; font-weight:600; color:hsl(var(--h) 70% 78%); display:flex; align-items:center; gap:8px; }
  .card .dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.2); margin-left:auto; }
  .card .dot.on { background:hsl(var(--h) 80% 70%); box-shadow:0 0 8px hsl(var(--h) 80% 70%); }
  .card .st { color:rgba(243,230,195,.6); font-size:13px; min-height:18px; }
  .card button { font:inherit; font-size:12px; background:none; color:hsl(var(--h) 60% 75%); border:1px solid hsl(var(--h) 60% 60% / .4); border-radius:6px; padding:2px 8px; cursor:pointer; margin-top:4px; }
  .puz { display:flex; gap:8px; flex-wrap:wrap; }
  .puz span { font-size:12px; letter-spacing:.12em; text-transform:uppercase; border:1px solid rgba(243,230,195,.3); border-radius:999px; padding:4px 10px; color:rgba(243,230,195,.6); cursor:pointer; }
  .puz span.ok { color:#f0d36a; border-color:#f0d36a; text-shadow:0 0 8px rgba(240,211,106,.6); }
  .feed { flex:1; overflow-y:auto; border:1px solid rgba(243,230,195,.2); border-radius:12px; padding:12px 16px; background:rgba(0,0,0,.35); font-size:15px; scrollbar-width:thin; }
  .feed .heard { color:rgba(243,230,195,.55); font-style:italic; }
  .feed .say b { font-style:italic; }
  .feed .phase { color:#f0d36a; letter-spacing:.12em; font-size:12px; text-transform:uppercase; margin:8px 0; }
  .bar { display:flex; gap:10px; }
  .bar input { flex:1; font:inherit; background:rgba(0,0,0,.4); color:#f3e6c3; border:1px solid rgba(243,230,195,.3); border-radius:10px; padding:9px 14px; }
  .mics { display:flex; gap:6px; }
  .mics span { font-size:11px; letter-spacing:.1em; border:1px solid rgba(243,230,195,.25); border-radius:6px; padding:2px 7px; color:rgba(243,230,195,.55); }
  .mics span.live { color:#8aa46a; border-color:#8aa46a; }
</style>
<body>
<div id="bg"></div><canvas id="noise" width="160" height="100"></canvas><div id="scan"></div><div id="vig"></div>
<div id="ui">
  <div class="top"><h1>the mushroom room</h1><span id="stage" style="color:#f0d36a;letter-spacing:.2em;text-transform:uppercase;font-size:13px"></span>
    <div class="mics" id="mics"></div>
    <button id="startb" onclick="api('/api/start',{})">start fresh</button>
    <button id="pauseb" onclick="api('/api/pause',{})">pause</button>
    <a href="/mics" target="_blank" style="color:#9be3e8">mics</a><a href="/door" target="_blank" style="color:#9be3e8">door</a></div>
  <div class="main">
    <div class="scroll"><div class="lbl">the scroll-creature · a base model continues the White Rabbit's notebook</div>
      <div class="base" id="base"></div><div class="dead" id="basestat"></div></div>
    <div class="right">
      <div class="chars" id="chars"></div>
      <div class="puz" id="puz"></div>
      <div class="feed" id="feed"></div>
    </div>
  </div>
  <div class="bar"><input id="note" placeholder="speak as the room (counts as a visitor line) · enter" onkeydown="if(event.key==='Enter'){api('/api/note',{text:this.value});this.value=''}"></div>
</div>
<script>
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
async function api(p,d){return (await fetch(p,{method:d?'POST':'GET',headers:{'Content-Type':'application/json'},body:d?JSON.stringify(d):undefined})).json();}
const cv=document.getElementById('noise'), cx=cv.getContext('2d'); const img=cx.createImageData(cv.width,cv.height);
setInterval(()=>{ const d=img.data; for(let i=0;i<d.length;i+=4){ const v=(Math.random()*255)|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; } cx.putImageData(img,0,0); }, 1000/12);
let lastLen=-1, lastBase='';
const PUZ={mushroom:'the mushroom',user:'the user',door:'the little door'};
async function poll(){
  try{ const S=await api('/api/state');
    document.getElementById('pauseb').className=S.paused?'on':''; document.getElementById('pauseb').textContent=S.paused?'PAUSED — resume':'pause';
    document.getElementById('startb').className=S.running?'':'on';
    const rung=(S.ladder||[])[S.rung||0]; document.getElementById('stage').textContent=(S.stage||'idle')+(S.active?' · '+S.active:'')+(S.stage==='scroll'&&rung?'   word: '+rung.word+(rung.humansSaidIt?' (SPOILT — click forgive)':''):'')+(S.stage==='user'&&S.subject?'   poem about '+S.subject:'')+'   (space = next stage)';
    document.getElementById('stage').onclick=()=>{ if(S.stage==='scroll') api('/api/forgive',{}); };
    document.getElementById('mics').innerHTML=[1,2,3,4,5,6,7].map(i=>{const m=S.mics[i]; const live=S.micSpeech&&S.micSpeech[i-1]!=null&&S.micSpeech[i-1]<4; return `<span class="${live?'live':''}">${i} ${m?esc(m.name):''}</span>`;}).join('');
    document.getElementById('chars').innerHTML=S.chars.map(c=>`<div class="card" style="--h:${c.hue}"><div class="nm">${esc(c.name)}<span class="dot ${c.status==='thinking'?'on':''}"></span></div><div class="st">${esc(c.lastStatus)}</div><button onclick="api('/api/nudge',{name:'${esc(c.name)}'})">nudge</button></div>`).join('');
    document.getElementById('puz').innerHTML=Object.keys(PUZ).map(k=>`<span class="${S.puzzles[k]&&S.puzzles[k].solved?'ok':''}" onclick="api('/api/solve',{puzzle:'${k}',solved:!(S.puzzles['${k}']&&S.puzzles['${k}'].solved)})">${PUZ[k]}</span>`).join('');
    document.getElementById('basestat').textContent = S.base.alive ? 'base model: local Qwen2.5-3B, raw, no chat template' : 'base model OFFLINE — falling back to an instruct model told to only continue';
    if(S.base.text!==lastBase){ lastBase=S.base.text; document.getElementById('base').innerHTML=esc(S.base.text)+' <span class="cursor"></span>'; }
    if(S.ctx.length!==lastLen){ lastLen=S.ctx.length; const f=document.getElementById('feed');
      f.innerHTML=S.ctx.slice(-120).map(e=>{ if(e.kind==='heard') return `<div class="heard">${esc(e.who)}: ${esc(e.text)}</div>`;
        if(e.kind==='say'){ const c=S.chars.find(x=>x.name===e.player)||{hue:0}; return `<div class="say"><b style="color:hsl(${c.hue} 70% 75%)">${esc(e.player)}:</b> ${esc(e.text)}</div>`; }
        return `<div class="phase">${esc(e.text)}</div>`; }).join(''); f.scrollTop=f.scrollHeight; }
  }catch(e){}
  setTimeout(poll,1000);
}
poll();
document.addEventListener('keydown', e=>{ if(e.code==='Space' && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); api('/api/advance',{}); } });
</script>
</body>
